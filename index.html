<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Laboratório Virtual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // 1. Adicionamos o "Pillow" para ler a imagem
          requirements: ["pandas", "numpy", "Pillow"], 
          
          entrypoint: "app.py", 
          
          files: {
            "app.py": {
              url: "app.py" 
            },
            // 2. Avisamos o Stlite que a imagem existe e onde ela está
            "diagrama.jpg": {
              url: "diagrama.jpg"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
